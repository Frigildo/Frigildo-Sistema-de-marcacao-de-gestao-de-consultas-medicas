<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Agenda',
          pageTitle='Gestão de Horários',
          activeMenu='agenda',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="row">

        <!-- Formulário -->
        <div class="col-md-4">
            <div class="card card-primary">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-plus mr-2"></i>
                        Adicionar Horário
                    </h3>
                </div>
                <div class="card-body">

                    <!-- Selecção médico -->
                    <div class="form-group">
                        <label>Médico
                            <span class="text-danger">*</span>
                        </label>

                        <!-- Nenhum médico -->
                        <div th:if="${selectedDoctor == null}">
                            <div class="input-group">
                                <input type="text"
                                       class="form-control"
                                       value="Nenhum médico seleccionado"
                                       readonly>
                                <div class="input-group-append">
                                    <a th:href="@{/agenda/select-doctor}"
                                       class="btn btn-outline-primary">
                                        <i class="fas fa-search mr-1"></i>
                                        Escolher
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Médico seleccionado -->
                        <div th:if="${selectedDoctor != null}">
                            <div class="input-group">
                                <input type="text"
                                       class="form-control"
                                       th:value="${selectedDoctor.name}"
                                       readonly>
                                <div class="input-group-append">
                                    <a th:href="@{/agenda/select-doctor}"
                                       class="btn btn-outline-secondary">
                                        <i class="fas fa-exchange-alt mr-1"></i>
                                        Alterar
                                    </a>
                                </div>
                            </div>
                            <small class="text-muted"
                                   th:if="${selectedDoctor.specialtyName != null}">
                                <i class="fas fa-briefcase-medical mr-1"></i>
                                <span th:text="${selectedDoctor.specialtyName}"></span>
                            </small>
                        </div>
                    </div>

                    <!-- Formulário só se médico seleccionado -->
                    <form th:if="${selectedDoctor != null}"
                          th:action="@{/agenda/save}"
                          th:object="${agendaDTO}"
                          method="post">

                        <input type="hidden"
                               name="doctorId"
                               th:value="${doctorId}">

                        <div class="form-group">
                            <label>Data
                                <span class="text-danger">*</span>
                            </label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{date}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Hora de Início
                                <span class="text-danger">*</span>
                            </label>
                            <input type="time"
                                   class="form-control"
                                   th:field="*{startTime}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Hora de Fim
                                <span class="text-danger">*</span>
                            </label>
                            <input type="time"
                                   class="form-control"
                                   th:field="*{endTime}"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block">
                            <i class="fas fa-save mr-1"></i>
                            Adicionar Horário
                        </button>
                    </form>

                    <div th:unless="${selectedDoctor != null}"
                         class="text-center text-muted mt-3">
                        <i class="fas fa-info-circle mr-1"></i>
                        Seleccione um médico para
                        adicionar horários
                    </div>

                </div>
            </div>
        </div>

        <!-- Lista horários -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-calendar mr-2"></i>
                        Horários
                        <span th:if="${selectedDoctor != null}"
                              class="text-muted ml-2 font-weight-normal">
                            —
                            <span th:text="${selectedDoctor.name}"></span>
                        </span>
                    </h3>
                </div>
                <div class="card-body p-0">

                    <div th:if="${selectedDoctor == null}"
                         class="text-center text-muted py-5">
                        <i class="fas fa-user-md fa-3x mb-3 d-block text-muted"></i>
                        Seleccione um médico para
                        ver os seus horários
                    </div>

                    <table th:if="${selectedDoctor != null}"
                           class="table table-striped
                                  table-hover mb-0">
                        <thead class="thead-dark">
                            <tr>
                                <th>Data</th>
                                <th>Início</th>
                                <th>Fim</th>
                                <th>Estado</th>
                                <th>Acções</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="slot : ${slots}">
                                <td th:text="${#temporals.format(slot.date, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#temporals.format(slot.startTime, 'HH:mm')}"></td>
                                <td th:text="${#temporals.format(slot.endTime, 'HH:mm')}"></td>
                                <td>
                                    <span th:if="${slot.available}"
                                          class="badge badge-success">
                                        Disponível
                                    </span>
                                    <span th:unless="${slot.available}"
                                          class="badge badge-danger">
                                        Marcado
                                    </span>
                                </td>
                                <td>
                                    <a th:if="${slot.available}"
                                       th:href="@{/agenda/{id}/delete(id=${slot.id}, doctorId=${doctorId})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Tem a certeza?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                    <span th:unless="${slot.available}"
                                          class="text-muted">—</span>
                                </td>
                            </tr>
                            <tr th:if="${slots != null and #lists.isEmpty(slots)}">
                                <td colspan="5"
                                    class="text-center text-muted py-3">
                                    Sem horários definidos
                                    para este médico
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer"
                     th:if="${selectedDoctor != null}">
                    <small class="text-muted">
                        Total:
                        <strong th:text="${#lists.size(slots)}">
                        </strong>
                        horários
                    </small>
                </div>
            </div>
        </div>

    </div>

</th:block>
</html>
