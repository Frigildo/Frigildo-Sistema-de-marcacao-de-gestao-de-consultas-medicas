<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Horários Disponíveis',
          pageTitle='Horários Disponíveis',
          activeMenu='availableSlots',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-calendar-check mr-2"></i>
                Horários Disponíveis
            </h3>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped
                          table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Data</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Médico</th>
                        <th>Especialidade</th>
                        <th>Acção</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="slot : ${slots}">
                        <td th:text="${#temporals.format(
                            slot.date, 'dd/MM/yyyy')}">
                        </td>
                        <td th:text="${#temporals.format(
                            slot.startTime, 'HH:mm')}">
                        </td>
                        <td th:text="${#temporals.format(
                            slot.endTime, 'HH:mm')}">
                        </td>
                        <td th:text="${slot.doctorName}">
                        </td>
                        <td th:text="${slot.doctorSpecialty}">
                        </td>
                        <td>
                            <a th:href="@{/available-slots/{id}/book(id=${slot.id})}"
                               class="btn btn-success btn-sm"
                               onclick="return confirm('Confirma a marcação desta consulta?')">
                                <i class="fas fa-calendar-check mr-1"></i>
                                Marcar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(slots)}">
                        <td colspan="6"
                            class="text-center text-muted py-4">
                            <i class="fas fa-calendar-times fa-2x mb-2 d-block"></i>
                            Não há horários disponíveis de momento.
                            <br>
                            <small>
                                Tente mais tarde ou contacte
                                a recepção.
                            </small>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                Total:
                <strong th:text="${#lists.size(slots)}">
                </strong>
                horários disponíveis
            </small>
        </div>
    </div>

    <a th:href="@{/patients/consultations}"
       class="btn btn-secondary mt-2">
        <i class="fas fa-arrow-left mr-1"></i>
        Voltar às Minhas Consultas
    </a>

</th:block>
</html>
