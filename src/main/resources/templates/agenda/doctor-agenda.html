<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Minha Agenda',
          pageTitle='Gerir Horários',
          activeMenu='agenda',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="row">

        <!-- Formulário adicionar horário -->
        <div class="col-md-4">
            <div class="card card-primary">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-plus mr-2"></i>
                        Adicionar Horário
                    </h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/agenda/save}"
                          th:object="${agendaDTO}"
                          method="post">

                        <div class="form-group">
                            <label>Data
                                <span class="text-danger">*</span>
                            </label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{date}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Hora de Início
                                <span class="text-danger">*</span>
                            </label>
                            <input type="time"
                                   class="form-control"
                                   th:field="*{startTime}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Hora de Fim
                                <span class="text-danger">*</span>
                            </label>
                            <input type="time"
                                   class="form-control"
                                   th:field="*{endTime}"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block">
                            <i class="fas fa-save mr-1"></i>
                            Adicionar
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lista de horários -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-calendar mr-2"></i>
                        Meus Horários
                    </h3>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped
                                  table-hover mb-0">
                        <thead class="thead-dark">
                            <tr>
                                <th>Data</th>
                                <th>Início</th>
                                <th>Fim</th>
                                <th>Estado</th>
                                <th>Acções</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="slot : ${slots}">
                                <td th:text="${#temporals.format(slot.date, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#temporals.format(slot.startTime, 'HH:mm')}"></td>
                                <td th:text="${#temporals.format(slot.endTime, 'HH:mm')}"></td>
                                <td>
                                    <span th:if="${slot.available}"
                                          class="badge badge-success">
                                        Disponível
                                    </span>
                                    <span th:unless="${slot.available}"
                                          class="badge badge-danger">
                                        Marcado
                                    </span>
                                </td>
                                <td>
                                    <a th:if="${slot.available}"
                                       th:href="@{/agenda/{id}/delete(id=${slot.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Tem a certeza?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(slots)}">
                                <td colspan="5"
                                    class="text-center text-muted py-3">
                                    Não tem horários definidos
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer">
                    <small class="text-muted">
                        Total:
                        <strong th:text="${#lists.size(slots)}">
                        </strong>
                        horários
                    </small>
                </div>
            </div>
        </div>

    </div>

</th:block>
</html>
