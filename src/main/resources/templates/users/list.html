<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Utilizadores',
          pageTitle='Lista de Utilizadores',
          activeMenu='users',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-users mr-2"></i>
                Utilizadores
            </h3>
            <div class="card-tools d-flex">

                <form th:action="@{/users}"
                      method="get" class="mr-2">
                    <div class="input-group input-group-sm">
                        <input type="text"
                               name="search"
                               class="form-control"
                               th:value="${search}"
                               placeholder="Pesquisar por email...">
                        <div class="input-group-append">
                            <button type="submit"
                                    class="btn btn-default">
                                <i class="fas fa-search"></i>
                            </button>
                            <a th:if="${search != null}"
                               th:href="@{/users}"
                               class="btn btn-default">
                                <i class="fas fa-times"></i>
                            </a>
                        </div>
                    </div>
                </form>

                <a th:href="@{/users/new}"
                   class="btn btn-primary btn-sm">
                    <i class="fas fa-plus mr-1"></i>Novo
                </a>
            </div>
        </div>
        <div class="card-body">

            <div th:if="${search != null}"
                 class="alert alert-info mb-3">
                <i class="fas fa-search mr-2"></i>
                Resultados para:
                <strong th:text="${search}"></strong>
                <a th:href="@{/users}"
                   class="float-right">Limpar</a>
            </div>

            <table class="table table-bordered
                          table-striped table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>#</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Acções</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:text="${user.profile}"
                                  th:class="${user.profile.name() == 'ADMINISTRADOR'} ? 'badge badge-danger' : (${user.profile.name() == 'MEDICO'} ? 'badge badge-success' : 'badge badge-info')">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/users/{id}/edit(id=${user.id})}"
                               class="btn btn-warning btn-sm"
                               title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/users/{id}/delete(id=${user.id})}"
                               class="btn btn-danger btn-sm"
                               title="Apagar"
                               onclick="return confirm('Tem a certeza que deseja apagar?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="4"
                            class="text-center text-muted">
                            <i class="fas fa-search mr-2"></i>
                            Nenhum utilizador encontrado
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                Total:
                <strong th:text="${#lists.size(users)}">
                </strong>
                utilizadores
            </small>
        </div>
    </div>

</th:block>
</html>
