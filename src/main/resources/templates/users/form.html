<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Utilizador',
          pageTitle=${userId != null} ? 'Editar Utilizador' : 'Novo Utilizador',
          activeMenu='users',
          content=~{::content})}">

<th:block th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title"
                th:text="${userId != null} ?
                    'Editar Utilizador' : 'Novo Utilizador'">
            </h3>
        </div>
        <div class="card-body">

            <!-- Erro -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible">
                <button type="button" class="close"
                        data-dismiss="alert">&times;</button>
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- CRIAR -->
            <form th:if="${userId == null}"
                  th:action="@{/users/save}"
                  th:object="${userDTO}"
                  method="post"
                  id="createForm">

                <div class="form-group">
                    <label>Email <span class="text-danger">*</span></label>
                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="exemplo@email.com"
                           required>
                </div>

                <div class="form-group">
                    <label>Password <span class="text-danger">*</span></label>
                    <input type="password"
                           class="form-control"
                           th:field="*{password}"
                           id="password"
                           placeholder="Mínimo 6 caracteres"
                           required>
                </div>

                <div class="form-group">
                    <label>Confirmar Password <span class="text-danger">*</span></label>
                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           placeholder="Repita a password"
                           required>
                    <small id="passwordError"
                           class="text-danger"
                           style="display:none;">
                        <i class="fas fa-exclamation-triangle mr-1"></i>
                        As passwords não coincidem!
                    </small>
                </div>

                <div class="form-group">
                    <label>Perfil <span class="text-danger">*</span></label>
                    <select class="form-control"
                            th:field="*{profile}"
                            required>
                        <option value="">
                            Seleccione o perfil
                        </option>
                        <option th:each="p : ${profiles}"
                                th:value="${p}"
                                th:text="${p}">
                        </option>
                    </select>
                </div>

                <div class="card-footer">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i>
                        Salvar
                    </button>
                    <a th:href="@{/users}"
                       class="btn btn-secondary ml-2">
                        <i class="fas fa-times mr-1"></i>
                        Cancelar
                    </a>
                </div>
            </form>

            <!-- EDITAR -->
            <form th:if="${userId != null}"
                  th:action="@{/users/{id}/update(id=${userId})}"
                  th:object="${userDTO}"
                  method="post"
                  id="editForm">

                <div class="form-group">
                    <label>Email <span class="text-danger">*</span></label>
                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="exemplo@email.com"
                           required>
                </div>

                <div class="form-group">
                    <label>
                        Nova Password
                        <small class="text-muted">
                            (deixe em branco para manter)
                        </small>
                    </label>
                    <input type="password"
                           class="form-control"
                           th:field="*{password}"
                           id="editPassword"
                           placeholder="Nova password">
                </div>

                <div class="form-group">
                    <label>
                        Confirmar Nova Password
                        <small class="text-muted">
                            (deixe em branco para manter)
                        </small>
                    </label>
                    <input type="password"
                           class="form-control"
                           id="editConfirmPassword"
                           placeholder="Repita a nova password">
                    <small id="editPasswordError"
                           class="text-danger"
                           style="display:none;">
                        <i class="fas fa-exclamation-triangle mr-1"></i>
                        As passwords não coincidem!
                    </small>
                </div>

                <div class="form-group">
                    <label>Perfil <span class="text-danger">*</span></label>
                    <select class="form-control"
                            th:field="*{profile}"
                            required>
                        <option th:each="p : ${profiles}"
                                th:value="${p}"
                                th:text="${p}">
                        </option>
                    </select>
                </div>

                <div class="card-footer">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i>
                        Actualizar
                    </button>
                    <a th:href="@{/users}"
                       class="btn btn-secondary ml-2">
                        <i class="fas fa-times mr-1"></i>
                        Cancelar
                    </a>
                </div>
            </form>

        </div>
    </div>

    <script>
        // CRIAR
        document.getElementById('createForm')
            ?.addEventListener('submit', function(e) {
                const pass = document
                    .getElementById('password').value;
                const confirm = document
                    .getElementById('confirmPassword').value;
                const error = document
                    .getElementById('passwordError');
                if (pass !== confirm) {
                    e.preventDefault();
                    error.style.display = 'block';
                    document.getElementById('confirmPassword')
                        .classList.add('is-invalid');
                }
            });

        // EDITAR
        document.getElementById('editForm')
            ?.addEventListener('submit', function(e) {
                const pass = document
                    .getElementById('editPassword').value;
                const confirm = document
                    .getElementById('editConfirmPassword').value;
                const error = document
                    .getElementById('editPasswordError');
                if (pass || confirm) {
                    if (pass !== confirm) {
                        e.preventDefault();
                        error.style.display = 'block';
                        document
                            .getElementById('editConfirmPassword')
                            .classList.add('is-invalid');
                    }
                }
            });

        // Feedback em tempo real
        document.getElementById('confirmPassword')
            ?.addEventListener('input', function() {
                const pass = document
                    .getElementById('password').value;
                const error = document
                    .getElementById('passwordError');
                if (this.value === pass) {
                    error.style.display = 'none';
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                } else {
                    error.style.display = 'block';
                    this.classList.add('is-invalid');
                    this.classList.remove('is-valid');
                }
            });
    </script>

</th:block>
</html>
