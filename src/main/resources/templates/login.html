<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Login | Sistema</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet"
          th:href="@{/adminlte/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet"
          th:href="@{/adminlte/plugins/icheck-bootstrap/icheck-bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/adminlte/dist/css/adminlte.min.css}">
</head>
<body class="hold-transition login-page">
<div class="login-box">

    <!-- Logo -->
    <div class="login-logo">
        <b>Centro de Saúde</b> Dream
    </div>

    <div class="card">
        <div class="card-body login-card-body">

            <p class="login-box-msg">
                Inicie sessão no sistema
            </p>

            <!-- Erro de credenciais -->
            <div th:if="${param.error}"
                 class="alert alert-danger
                        alert-dismissible fade show">
                <button type="button"
                        class="close"
                        data-dismiss="alert">
                    <span>&times;</span>
                </button>
                <i class="fas fa-exclamation-triangle mr-2"></i>
                Email ou senha incorrectos!
                Verifique os seus dados ou
                contacte o administrador.
            </div>

            <!-- Sucesso de registo -->
            <div th:if="${success}"
                 class="alert alert-success
                        alert-dismissible fade show">
                <button type="button"
                        class="close"
                        data-dismiss="alert">
                    <span>&times;</span>
                </button>
                <i class="fas fa-check-circle mr-2"></i>
                <span th:text="${success}"></span>
            </div>

            <!-- Logout -->
            <div th:if="${param.logout}"
                 class="alert alert-success
                        alert-dismissible fade show">
                <button type="button"
                        class="close"
                        data-dismiss="alert">
                    <span>&times;</span>
                </button>
                <i class="fas fa-check-circle mr-2"></i>
                Sessão terminada com sucesso!
            </div>

            <!-- Formulário -->
            <form th:action="@{/login}" method="post">

                <!-- Email -->
                <div class="input-group mb-3">
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Email"
                           required
                           autofocus>
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope"></span>
                        </div>
                    </div>
                </div>

                <!-- Senha -->
                <div class="input-group mb-3">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Senha"
                           required>
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-lock"></span>
                        </div>
                    </div>
                </div>

                <!-- Botão entrar -->
                <div class="row">
                    <div class="col-12">
                        <button type="submit"
                                class="btn btn-primary btn-block">
                            <i class="fas fa-sign-in-alt mr-2"></i>
                            Entrar
                        </button>
                    </div>
                </div>

            </form>

            <!-- Separador -->
            <div class="mt-3 mb-1 text-center">
                <hr>
                <small class="text-muted">
                    É paciente e ainda não tem conta?
                </small>
            </div>

            <!-- Botão criar conta -->
            <a th:href="@{/register}"
               class="btn btn-outline-success btn-block">
                <i class="fas fa-user-plus mr-2"></i>
                Criar nova conta
            </a>

            <!-- Nota admin -->
            <div class="mt-3 text-center">
                <small class="text-muted">
                    <i class="fas fa-info-circle mr-1"></i>
                    Funcionários contactem o administrador
                </small>
            </div>

        </div>
    </div>

</div>

<script th:src="@{/adminlte/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/adminlte/dist/js/adminlte.js}"></script>
</body>
</html>
