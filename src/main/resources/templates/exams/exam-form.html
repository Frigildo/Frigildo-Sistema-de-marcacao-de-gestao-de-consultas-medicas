<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Novo Exame',
          pageTitle='Adicionar Exame ao Atendimento',
          activeMenu='attendances',
          content=~{::content})}">

<th:block th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-flask mr-2"></i>
                Adicionar Exame
            </h3>
        </div>
        <div class="card-body">

            <!-- Info do atendimento -->
            <div class="callout callout-info mb-4">
                <h5>
                    <i class="fas fa-info-circle mr-2"></i>
                    Atendimento
                </h5>
                <p class="mb-0">
                    <strong>Paciente:</strong>
                    <span th:text="${attendance.patientName}"></span>
                    &nbsp;&nbsp;
                    <strong>Médico:</strong>
                    <span th:text="${attendance.doctorName}"></span>
                </p>
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible">
                <button type="button" class="close"
                        data-dismiss="alert">&times;</button>
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/attendances/{id}/exams/save(id=${attendanceId})}"
                  th:object="${examDTO}"
                  method="post">

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Tipo de Exame
                                <span class="text-danger">*</span>
                            </label>
							<select class="form-control"
							        th:field="*{type}"
							        required>
							    <option value="">
							        Seleccione o tipo
							    </option>
							    <option th:each="t : ${examTypes}"
							            th:value="${t}"
							            th:text="${t}">
							    </option>
							</select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Data
                                <span class="text-danger">*</span>
                            </label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{date}"
                                   required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        Resultado
                        <small class="text-muted">
                            (pode ser preenchido depois)
                        </small>
                    </label>
                    <textarea class="form-control"
                              th:field="*{result}"
                              rows="4"
                              placeholder="Resultado do exame (opcional agora)">
                    </textarea>
                </div>

                <div class="card-footer">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i>
                        Guardar Exame
                    </button>
                    <a th:href="@{/attendances/{id}/edit(id=${attendanceId})}"
                       class="btn btn-secondary ml-2">
                        <i class="fas fa-times mr-1"></i>
                        Cancelar
                    </a>
                </div>
            </form>

        </div>
    </div>
</th:block>
</html>
