<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Marcar Consulta',
          pageTitle='Marcar Consulta',
          activeMenu='myConsultations',
          content=~{::content})}">

<th:block th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-calendar-plus mr-2"></i>
                Marcar Nova Consulta
            </h3>
        </div>
        <div class="card-body">

            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible">
                <button type="button" class="close"
                        data-dismiss="alert">&times;</button>
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/patients/consultations/save}"
                  th:object="${consultationDTO}"
                  method="post">

                <!-- patientId oculto -->
                <input type="hidden"
                       th:field="*{patientId}">

                <!-- status oculto → sempre AGENDADA -->
                <input type="hidden"
                       th:field="*{status}">

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Data
                                <span class="text-danger">*</span>
                            </label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{date}"
                                   required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Hora
                                <span class="text-danger">*</span>
                            </label>
                            <input type="time"
                                   class="form-control"
                                   th:field="*{time}"
                                   required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Médico
                        <span class="text-danger">*</span>
                    </label>
                    <select class="form-control"
                            th:field="*{doctorId}"
                            required>
                        <option value="">
                            Seleccione o médico
                        </option>
                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.name}">
                        </option>
                    </select>
                </div>

                <div class="card-footer">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="fas fa-calendar-check mr-1"></i>
                        Marcar Consulta
                    </button>
                    <a th:href="@{/patients/consultations}"
                       class="btn btn-secondary ml-2">
                        <i class="fas fa-times mr-1"></i>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</th:block>
</html>
