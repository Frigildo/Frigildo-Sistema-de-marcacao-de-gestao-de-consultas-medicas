<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Meu Perfil',
          pageTitle='Meu Perfil',
          activeMenu='profile',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>

    <div class="row">

        <!-- Card Perfil -->
        <div class="col-md-4">
            <div class="card card-primary card-outline">
                <div class="card-body box-profile">
                    <div class="text-center mb-3">
                        <i class="fas fa-user-circle fa-5x text-primary"></i>
                    </div>
                    <h3 class="profile-username text-center"
                        th:text="${patient.name}">
                    </h3>
                    <p class="text-muted text-center">
                        <span class="badge badge-info">
                            Paciente
                        </span>
                    </p>
                    <ul class="list-group list-group-unbordered mb-3">
                        <li class="list-group-item">
                            <b><i class="fas fa-venus-mars mr-1"></i> Género</b>
                            <span class="float-right"
                                  th:text="${patient.gender}">
                            </span>
                        </li>
                        <li class="list-group-item">
                            <b><i class="fas fa-birthday-cake mr-1"></i> Data de Nascimento</b>
                            <span class="float-right"
                                  th:text="${#temporals.format(patient.dateOfBirth, 'dd/MM/yyyy')}">
                            </span>
                        </li>
                        <li class="list-group-item">
                            <b><i class="fas fa-phone mr-1"></i> Telefone</b>
                            <span class="float-right"
                                  th:text="${patient.phone}">
                            </span>
                        </li>
                        <li class="list-group-item">
                            <b><i class="fas fa-map-marker-alt mr-1"></i> Morada</b>
                            <span class="float-right"
                                  th:text="${patient.address}">
                            </span>
                        </li>
                    </ul>
                    <a th:href="@{/patients/profile/edit}"
                       class="btn btn-primary btn-block">
                        <i class="fas fa-edit mr-1"></i>
                        Editar Perfil
                    </a>
                    <a th:href="@{/patients/history}"
                       class="btn btn-info btn-block mt-2">
                        <i class="fas fa-history mr-1"></i>
                        Ver Histórico Clínico
                    </a>
                </div>
            </div>
        </div>

        <!-- Card resumo rápido -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-info-circle mr-2"></i>
                        Acesso Rápido
                    </h3>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <a th:href="@{/patients/history}"
                               class="info-box bg-info text-white">
                                <span class="info-box-icon">
                                    <i class="fas fa-calendar-check"></i>
                                </span>
                                <div class="info-box-content">
                                    <span class="info-box-text">
                                        Consultas
                                    </span>
                                    <span class="info-box-number">
                                        Ver histórico
                                    </span>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-6 mb-3">
                            <a th:href="@{/patients/history}"
                               class="info-box bg-success text-white">
                                <span class="info-box-icon">
                                    <i class="fas fa-flask"></i>
                                </span>
                                <div class="info-box-content">
                                    <span class="info-box-text">
                                        Exames
                                    </span>
                                    <span class="info-box-number">
                                        Ver histórico
                                    </span>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-6 mb-3">
                            <a th:href="@{/patients/history}"
                               class="info-box bg-warning text-white">
                                <span class="info-box-icon">
                                    <i class="fas fa-stethoscope"></i>
                                </span>
                                <div class="info-box-content">
                                    <span class="info-box-text">
                                        Atendimentos
                                    </span>
                                    <span class="info-box-number">
                                        Ver histórico
                                    </span>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-6 mb-3">
                            <a th:href="@{/patients/history}"
                               class="info-box bg-danger text-white">
                                <span class="info-box-icon">
                                    <i class="fas fa-comments"></i>
                                </span>
                                <div class="info-box-content">
                                    <span class="info-box-text">
                                        Aconselhamentos
                                    </span>
                                    <span class="info-box-number">
                                        Ver histórico
                                    </span>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</th:block>
</html>
