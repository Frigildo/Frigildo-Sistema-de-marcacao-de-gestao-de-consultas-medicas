<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Editar Perfil',
          pageTitle='Editar Perfil',
          activeMenu='profile',
          content=~{::content})}">

<th:block th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-user-edit mr-2"></i>
                Editar Perfil
            </h3>
        </div>
        <div class="card-body">

            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible">
                <button type="button" class="close"
                        data-dismiss="alert">&times;</button>
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/patients/profile/update}"
                  th:object="${patientDTO}"
                  method="post">

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Nome
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="Nome completo"
                                   required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Data de Nascimento
                                <span class="text-danger">*</span>
                            </label>
                            <input type="date"
                                   class="form-control"
                                   th:field="*{dateOfBirth}"
                                   required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Género
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-control"
                                    th:field="*{gender}"
                                    required>
                                <option th:each="g : ${genders}"
                                        th:value="${g}"
                                        th:text="${g}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Telefone
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{phone}"
                                   placeholder="9 dígitos"
                                   required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Morada</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{address}"
                           placeholder="Morada completa">
                </div>

                <div class="card-footer">
                    <button type="submit"
                            class="btn btn-primary">
                        <i class="fas fa-save mr-1"></i>
                        Guardar
                    </button>
                    <a th:href="@{/patients/profile}"
                       class="btn btn-secondary ml-2">
                        <i class="fas fa-times mr-1"></i>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</th:block>
</html>
