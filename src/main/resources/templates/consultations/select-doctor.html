<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Seleccionar Horário',
          pageTitle='Seleccionar Médico e Horário',
          activeMenu='consultations',
          content=~{::content})}">

<th:block th:fragment="content">

    <!-- Info paciente seleccionado -->
    <div class="callout callout-info mb-3">
        <h5>
            <i class="fas fa-user mr-2"></i>
            Paciente Seleccionado
        </h5>
        <p class="mb-0"
           th:if="${selectedPatient != null}">
            <strong th:text="${selectedPatient.name}"></strong>
            <span class="badge badge-info ml-2"
                  th:text="${selectedPatient.patientNumber}">
            </span>
            &nbsp;|&nbsp;
            <i class="fas fa-phone mr-1"></i>
            <span th:text="${selectedPatient.phone}"></span>
        </p>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-calendar-alt mr-2"></i>
                Horários Disponíveis
            </h3>
            <div class="card-tools">
                <form th:action="@{/consultations/select-doctor}"
                      method="get">
                    <input type="hidden"
                           name="patientId"
                           th:value="${patientId}">
                    <div class="input-group input-group-sm">
                        <input type="text"
                               name="search"
                               class="form-control"
                               th:value="${search}"
                               placeholder="Pesquisar por médico...">
                        <div class="input-group-append">
                            <button type="submit"
                                    class="btn btn-default">
                                <i class="fas fa-search"></i>
                            </button>
                            <a th:if="${search != null}"
                               th:href="@{/consultations/select-doctor(patientId=${patientId})}"
                               class="btn btn-default">
                                <i class="fas fa-times"></i>
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Médico</th>
                        <th>Especialidade</th>
                        <th>Data</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Acção</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="slot : ${slots}">
                        <td th:text="${slot.doctorName}"></td>
                        <td th:text="${slot.doctorSpecialty != null} ? ${slot.doctorSpecialty} : '—'"></td>
                        <td th:text="${#temporals.format(slot.date, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(slot.startTime, 'HH:mm')}"></td>
                        <td th:text="${#temporals.format(slot.endTime, 'HH:mm')}"></td>
                        <td>
                            <a th:href="@{/consultations/new(patientId=${patientId}, doctorId=${slot.doctorId}, agendaId=${slot.id})}"
                               class="btn btn-success btn-sm">
                                <i class="fas fa-check mr-1"></i>
                                Marcar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(slots)}">
                        <td colspan="6"
                            class="text-center text-muted py-4">
                            <i class="fas fa-calendar-times fa-2x mb-2 d-block"></i>
                            Não há horários disponíveis
                            <br>
                            <small>
                                Contacte a administração para
                                adicionar horários
                            </small>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                Total:
                <strong th:text="${#lists.size(slots)}"></strong>
                horários disponíveis
            </small>
        </div>
    </div>

    <a th:href="@{/consultations/select-patient}"
       class="btn btn-secondary mt-2">
        <i class="fas fa-arrow-left mr-1"></i>
        Voltar aos Pacientes
    </a>

</th:block>
</html>
