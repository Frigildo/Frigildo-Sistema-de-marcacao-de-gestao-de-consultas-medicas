<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Seleccionar Paciente',
          pageTitle='Seleccionar Paciente',
          activeMenu='consultations',
          content=~{::content})}">

<th:block th:fragment="content">

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-procedures mr-2"></i>
                Seleccionar Paciente
            </h3>
            <div class="card-tools">
                <form th:action="@{/consultations/select-patient}"
                      method="get">
                    <div class="input-group input-group-sm">
                        <input type="text"
                               name="search"
                               class="form-control"
                               th:value="${search}"
                               placeholder="Pesquisar por nome...">
                        <div class="input-group-append">
                            <button type="submit"
                                    class="btn btn-default">
                                <i class="fas fa-search"></i>
                            </button>
                            <a th:if="${search != null}"
                               th:href="@{/consultations/select-patient}"
                               class="btn btn-default">
                                <i class="fas fa-times"></i>
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Nº Paciente</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Acção</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${patients}">
                        <td>
                            <span class="badge badge-info"
                                  th:text="${p.patientNumber}">
                            </span>
                        </td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.phone}"></td>
                        <td>
                            <!-- Vai para select-doctor
                                 mantendo o paciente -->
                            <a th:href="@{/consultations/select-doctor(patientId=${p.id})}"
                               class="btn btn-primary btn-sm">
                                <i class="fas fa-arrow-right mr-1"></i>
                                Seleccionar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="4"
                            class="text-center text-muted py-3">
                            Nenhum paciente encontrado
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                Total:
                <strong th:text="${#lists.size(patients)}"></strong>
                pacientes
            </small>
        </div>
    </div>

    <a th:href="@{/consultations/new}"
       class="btn btn-secondary mt-2">
        <i class="fas fa-arrow-left mr-1"></i>
        Cancelar
    </a>

</th:block>
</html>
