<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Consultas',
          pageTitle='Lista de Consultas',
          activeMenu='consultations',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-calendar-check mr-2"></i>
                Consultas
            </h3>
            <div class="card-tools d-flex">

                <!-- Filtro por estado -->
                <form th:action="@{/consultations}"
                      method="get" class="mr-2">
                    <div class="input-group input-group-sm">
                        <select name="status"
                                class="form-control">
                            <option value="">
                                Todos os estados
                            </option>
                            <option
                                th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${s == selectedStatus}">
                            </option>
                        </select>
                        <div class="input-group-append">
                            <button type="submit"
                                    class="btn btn-default">
                                <i class="fas fa-filter"></i>
                            </button>
                            <a th:if="${selectedStatus != null}"
                               th:href="@{/consultations}"
                               class="btn btn-default">
                                <i class="fas fa-times"></i>
                            </a>
                        </div>
                    </div>
                </form>

                <!-- Só admin cria consultas -->
                <a th:if="${userRole == 'ADMINISTRADOR'}"
                   th:href="@{/consultations/new}"
                   class="btn btn-primary btn-sm">
                    <i class="fas fa-plus mr-1"></i>Nova
                </a>
            </div>
        </div>
        <div class="card-body p-0">

            <div th:if="${selectedStatus != null}"
                 class="alert alert-info m-3 mb-0">
                <i class="fas fa-filter mr-2"></i>
                A filtrar por:
                <strong th:text="${selectedStatus}"></strong>
                <a th:href="@{/consultations}"
                   class="float-right">Limpar</a>
            </div>

            <table class="table table-bordered
                          table-striped table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th>Estado</th>
                        <th>Acções</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${consultations}">
                        <td th:text="${#temporals.format(
                            c.date, 'dd/MM/yyyy')}">
                        </td>
                        <td th:text="${#temporals.format(
                            c.time, 'HH:mm')}">
                        </td>
                        <td th:text="${c.patientName}"></td>
                        <td th:text="${c.doctorName}"></td>
                        <td>
                            <span th:text="${c.status}"
                                  th:class="${c.status.name() == 'AGENDADA'} ? 'badge badge-warning' : (${c.status.name() == 'CONCLUIDA'} ? 'badge badge-success' : 'badge badge-danger')">
                            </span>
                        </td>
                        <td>
                            <!-- ADMIN — editar e apagar -->
                            <th:block th:if="${userRole == 'ADMINISTRADOR'}">
                                <a th:href="@{/consultations/{id}/edit(id=${c.id})}"
                                   class="btn btn-warning btn-sm"
                                   title="Editar">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/consultations/{id}/delete(id=${c.id})}"
                                   class="btn btn-danger btn-sm"
                                   title="Apagar"
                                   onclick="return confirm('Tem a certeza?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </th:block>

                            <!-- MÉDICO — iniciar atendimento -->
                            <th:block th:if="${userRole == 'MEDICO'}">
                                <a th:if="${c.status.name() == 'AGENDADA'}"
                                   th:href="@{/attendances/new/from-consultation/{id}(id=${c.id})}"
                                   class="btn btn-success btn-sm"
                                   title="Iniciar Atendimento">
                                    <i class="fas fa-stethoscope mr-1"></i>
                                    Iniciar Atendimento
                                </a>
                                <span th:if="${c.status.name() == 'CONCLUIDA'}"
                                      class="badge badge-success">
                                    <i class="fas fa-check mr-1"></i>
                                    Concluída
                                </span>
                                <span th:if="${c.status.name() == 'CANCELADA'}"
                                      class="badge badge-danger">
                                    <i class="fas fa-times mr-1"></i>
                                    Cancelada
                                </span>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(consultations)}">
                        <td colspan="6"
                            class="text-center text-muted py-3">
                            <i class="fas fa-calendar mr-2"></i>
                            Nenhuma consulta encontrada
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                Total:
                <strong th:text="${#lists.size(consultations)}">
                </strong>
                consultas
            </small>
        </div>
    </div>

</th:block>
</html>
