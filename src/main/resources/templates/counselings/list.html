<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Aconselhamentos',
          pageTitle='Lista de Aconselhamentos',
          activeMenu='counselings',
          content=~{::content})}">

<th:block th:fragment="content">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <button type="button" class="close"
                data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-comments mr-2"></i>
                Aconselhamentos
            </h3>
            <div class="card-tools">
                <a th:href="@{/counselings/new}"
                   class="btn btn-primary btn-sm">
                    <i class="fas fa-plus mr-1"></i>
                    Novo
                </a>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-bordered
                          table-striped table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Data</th>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th>Descrição</th>
                        <th>Acções</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${counselings}">
                        <td th:text="${#temporals.format(c.date, 'dd/MM/yyyy')}"></td>
                        <td th:text="${c.patientName}"></td>
                        <td th:text="${c.doctorName}"></td>
                        <td th:text="${c.description}"></td>
                        <td>
                            <a th:href="@{/counselings/{id}/edit(id=${c.id})}"
                               class="btn btn-warning btn-sm"
                               title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/counselings/{id}/delete(id=${c.id})}"
                               class="btn btn-danger btn-sm"
                               title="Apagar"
                               onclick="return confirm('Tem a certeza?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(counselings)}">
                        <td colspan="5"
                            class="text-center text-muted py-3">
                            <i class="fas fa-comments mr-2"></i>
                            Nenhum aconselhamento encontrado
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <small class="text-muted">
                Total:
                <strong th:text="${#lists.size(counselings)}">
                </strong>
                aconselhamentos
            </small>
        </div>
    </div>

</th:block>
</html>
