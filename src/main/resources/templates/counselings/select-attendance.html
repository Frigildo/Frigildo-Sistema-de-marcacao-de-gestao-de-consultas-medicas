<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Seleccionar Atendimento',
          pageTitle='Seleccionar Atendimento',
          activeMenu='counselings',
          content=~{::content})}">

<th:block th:fragment="content">

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-stethoscope mr-2"></i>
                Seleccionar Atendimento
            </h3>
            <div class="card-tools">
                <form th:action="@{/counselings/select-attendance}"
                      method="get">
                    <div class="input-group input-group-sm">
                        <input type="text"
                               name="search"
                               class="form-control"
                               th:value="${search}"
                               placeholder="Pesquisar por paciente...">
                        <div class="input-group-append">
                            <button type="submit"
                                    class="btn btn-default">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th>Data</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${attendances}">
                        <td th:text="${a.patientName}"></td>
                        <td th:text="${a.doctorName}"></td>
                        <td th:text="${#temporals.format(a.attendanceDate, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:if="${a.status.name() == 'PENDENTE'}"
                                  class="badge badge-warning">
                                Pendente
                            </span>
                            <span th:if="${a.status.name() == 'AGUARDA_EXAMES'}"
                                  class="badge badge-info">
                                Aguarda Exames
                            </span>
                            <span th:if="${a.status.name() == 'CONCLUIDO'}"
                                  class="badge badge-success">
                                Concluído
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/counselings/new(attendanceId=${a.id})}"
                               class="btn btn-primary btn-sm">
                                <i class="fas fa-check mr-1"></i>
                                Seleccionar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(attendances)}">
                        <td colspan="5"
                            class="text-center text-muted py-3">
                            Nenhum atendimento encontrado
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</th:block>
</html>
