<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(
          title='Dashboard',
          pageTitle='Dashboard',
          activeMenu='dashboard',
          content=~{::content})}">

<th:block th:fragment="content">

    <!-- Saudação -->
    <div class="callout callout-success mb-4">
        <h5>
            <i class="fas fa-user-md mr-2"></i>
            Bem-vindo,
            <span th:text="${doctorName}"></span>!
        </h5>
        <p class="mb-0">
            Aqui está o resumo da sua actividade.
        </p>
    </div>

    <!-- Cards -->
    <div class="row">
        <div class="col-lg-3 col-6">
            <div class="small-box bg-gradient-info">
                <div class="inner">
                    <h3 th:text="${myConsultations}">0</h3>
                    <p>Total Consultas</p>
                </div>
                <div class="icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <a th:href="@{/consultations}"
                   class="small-box-footer">
                    Ver todas
                    <i class="fas fa-arrow-circle-right ml-1"></i>
                </a>
            </div>
        </div>
        <div class="col-lg-3 col-6">
            <div class="small-box bg-gradient-warning">
                <div class="inner">
                    <h3 th:text="${myConsultationsAgendadas}">0</h3>
                    <p>Consultas Agendadas</p>
                </div>
                <div class="icon">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <a th:href="@{/consultations}"
                   class="small-box-footer">
                    Ver todas
                    <i class="fas fa-arrow-circle-right ml-1"></i>
                </a>
            </div>
        </div>
        <div class="col-lg-3 col-6">
            <div class="small-box bg-gradient-success">
                <div class="inner">
                    <h3 th:text="${myAttendances}">0</h3>
                    <p>Atendimentos</p>
                </div>
                <div class="icon">
                    <i class="fas fa-stethoscope"></i>
                </div>
                <a th:href="@{/attendances}"
                   class="small-box-footer">
                    Ver todos
                    <i class="fas fa-arrow-circle-right ml-1"></i>
                </a>
            </div>
        </div>
        <div class="col-lg-3 col-6">
            <div class="small-box bg-gradient-danger">
                <div class="inner">
                    <h3 th:text="${myAvailableSlots}">0</h3>
                    <p>Horários Disponíveis</p>
                </div>
                <div class="icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <a th:href="@{/agenda}"
                   class="small-box-footer">
                    Gerir agenda
                    <i class="fas fa-arrow-circle-right ml-1"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Acesso rápido -->
    <div class="card">
        <div class="card-header border-0">
            <h3 class="card-title">
                <i class="fas fa-bolt mr-2 text-warning"></i>
                Acesso Rápido
            </h3>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 col-6 mb-3">
                    <a th:href="@{/agenda}"
                       class="btn btn-outline-primary btn-block py-3">
                        <i class="fas fa-calendar-plus fa-lg mb-1 d-block"></i>
                        Gerir Agenda
                    </a>
                </div>
                <div class="col-md-3 col-6 mb-3">
                    <a th:href="@{/attendances/new}"
                       class="btn btn-outline-success btn-block py-3">
                        <i class="fas fa-stethoscope fa-lg mb-1 d-block"></i>
                        Novo Atendimento
                    </a>
                </div>
                <div class="col-md-3 col-6 mb-3">
                    <a th:href="@{/exams/new}"
                       class="btn btn-outline-warning btn-block py-3">
                        <i class="fas fa-flask fa-lg mb-1 d-block"></i>
                        Novo Exame
                    </a>
                </div>
                <div class="col-md-3 col-6 mb-3">
                    <a th:href="@{/counselings/new}"
                       class="btn btn-outline-info btn-block py-3">
                        <i class="fas fa-comments fa-lg mb-1 d-block"></i>
                        Aconselhamento
                    </a>
                </div>
            </div>
        </div>
    </div>

</th:block>
</html>
